server {
  listen 5173;
  root /usr/share/nginx/html;
  index index.html;

  add_header Cache-Control "no-cache";

  location = /manifest.webmanifest {
    default_type application/manifest+json;
  }

  # API (sesión y partida guardada): el backend Node, en su propio contenedor con IP fija
  # dentro de web_gateway. IP fija a propósito, no por nombre: ver la nota junto a
  # ipv4_address en docker-compose.yml sobre por qué no nos fiamos del DNS interno de Docker.
  location ^~ /api/ {
    proxy_pass http://172.29.0.251:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location / {
    try_files $uri $uri/ =404;
  }

  location ~ /\.(?!well-known) { deny all; }
  location ~ ^/(Dockerfile|docker-compose\.yml|nginx\.conf|serve\.ps1|server\.js|package\.json|README\.md)$ { deny all; }
  # El código del backend no se sirve nunca como estático (solo se ejecuta en el contenedor "api").
  location ^~ /server/ { deny all; }
  location ^~ /data/ { deny all; }
}
