server {
  listen 5173;
  root /usr/share/nginx/html;
  index index.html;

  types {
    application/manifest+json webmanifest;
  }

  # Que el navegador revalide siempre: así el service worker y los scripts se actualizan.
  add_header Cache-Control "no-cache";

  location / {
    try_files $uri $uri/ =404;
  }

  # No servir ficheros de desarrollo.
  location ~ /\.(?!well-known) { deny all; }
  location ~ ^/(Dockerfile|docker-compose\.yml|nginx\.conf|serve\.ps1|server\.js|package\.json|README\.md)$ { deny all; }
}
